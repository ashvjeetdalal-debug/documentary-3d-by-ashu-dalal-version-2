<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>code-3d-video</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* Everything is sized in vmin so the same look works at any resolution / aspect ratio. */
  #label { position: absolute; top: 9vmin; left: 50%; transform: translateX(-50%); opacity: 0;
    font: 700 2.6vmin/1 'Helvetica Neue', Arial, sans-serif; letter-spacing: .25vmin; text-transform: uppercase;
    color: #fff; background: rgba(0,0,0,.55); padding: 1.3vmin 2.6vmin; border-radius: 99vmin; white-space: nowrap; }
  #captions { position: absolute; left: 6vmin; right: 6vmin; bottom: 20vh; text-align: center;
    font: 900 7.2vmin/1.14 'Inter', 'Helvetica Neue', Arial, sans-serif; text-transform: uppercase; color: #fff;
    -webkit-text-stroke: .5vmin #000; paint-order: stroke fill; text-shadow: 0 .6vmin 1.6vmin rgba(0,0,0,.6); }
  .w { display: inline-block; margin: 0 .16em; }
  .w.on { color: #ffe14d; transform: scale(1.08); }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js",
               "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="label"></div>
  <div id="captions"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
